<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Pro - Secure Rolling Limit</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #27ae60; --danger: #e74c3c; --dark: #2c3e50; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 0; }
        
        #pinOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; color: white;
        }
        .pin-box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; }
        .pin-input { font-size: 28px; text-align: center; padding: 10px; width: 180px; border-radius: 10px; border: none; margin: 15px 0; letter-spacing: 8px; }
        
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 20px; }
        .balance-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .rolling-card { background: #e3f2fd; border-left: 6px solid #2196f3; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        .btn { padding: 12px; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-add { background: var(--primary); font-size: 16px; }
        
        .search-box { background: #f1f8e9; border: 1px solid #c5e1a5; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .search-summary { display: flex; justify-content: space-between; margin-top: 10px; font-weight: bold; font-size: 14px; color: var(--dark); border-top: 1px dashed #ccc; padding-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        table th { background: #eee; padding: 10px; text-align: left; }
        table td { padding: 10px; border-bottom: 1px solid #eee; }
        .status-warn { color: var(--danger); font-weight: bold; }
        .status-safe { color: var(--primary); font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="pinOverlay">
    <div class="pin-box">
        <h2 id="pinTitle">🔒 Keuangan Pro</h2>
        <p id="pinMsg">Masukan PIN untuk mengakses data</p>
        <input type="password" id="inputPin" class="pin-input" maxlength="6" placeholder="******">
        <button class="btn" style="background: var(--primary);" onclick="verifyPin()">Masuk</button>
    </div>
</div>

<div class="container hidden" id="mainApp">
    <div class="balance-card">
        <h1>ILHAM HUDALLAH</h1>
        <small>TOTAL SALDO SAYA</small>
        <h1 id="totalBalanceDisplay">Rp 0</h1>
    </div>

    <div class="rolling-card">
        <div>
            <small><b>JATAH HARIAN POKOK</b></small><br>
            <input type="text" id="baseLimitInput" placeholder="20.000" oninput="formatCurrency(this, 'realBaseLimit')" style="width: 140px; margin-top:5px; padding:5px;">
            <input type="hidden" id="realBaseLimit" value="0">
        </div>
        <div style="text-align: right;">
            <small>SISA JATAH HARI INI:</small><br>
            <h2 id="rollingDisplay" style="margin:0;">Rp 0</h2>
        </div>
    </div>

    <input type="hidden" id="editIndex">
    <div style="display: flex; gap: 5px;">
        <select id="type" style="flex: 1;" onchange="updateCategoryOptions()">
            <option value="expense">Keluar (-)</option>
            <option value="income">Masuk (+)</option>
        </select>
        <input type="text" id="displayAmount" placeholder="Nominal Rp" style="flex: 2;" oninput="formatCurrency(this, 'realAmount')">
        <input type="hidden" id="realAmount">
        <input type="date" id="transDate" style="flex: 1.5;">
    </div>

    <div style="display: flex; gap: 5px;">
        <select id="category" style="flex: 1;"></select>
        <select id="wallet" style="flex: 1;">
            <option value="BCA">BCA</option>
            <option value="BRI">BRI</option>
            <option value="Dana">Dana</option>
            <option value="Seabank">Seabank</option>
            <option value="Tunai">Tunai</option>
        </select>
    </div>
    
    <textarea id="note" placeholder="Catatan tambahan..." rows="1"></textarea>
    <button class="btn btn-add" id="saveBtn" onclick="saveTransaction()">Simpan Transaksi</button>

    <div style="height: 180px; margin: 20px 0;"><canvas id="financeChart"></canvas></div>

    <div class="search-box">
        <input type="text" id="searchText" placeholder="Cari tanggal, kategori, wallet, atau catatan..." onkeyup="render()">
        <div class="search-summary" id="searchSummary">
            <span>Masuk: <span id="sumIncome" style="color:green">0</span></span>
            <span>Keluar: <span id="sumExpense" style="color:red">0</span></span>
        </div>
    </div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Detail</th>
                    <th>Nominal</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <button class="btn" style="background: #1f6f43; margin-top: 20px;" onclick="exportToExcel()">Download Excel (.xlsx)</button>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let appPin = localStorage.getItem('appPin');
    let myChart;

    // Fungsi baru untuk memasukkan tanggal hari ini berdasarkan waktu lokal (menghindari bug zona waktu)
    function setTodayDate() {
        const today = new Date();
        const offset = today.getTimezoneOffset();
        const localDate = new Date(today.getTime() - (offset * 60 * 1000));
        document.getElementById('transDate').value = localDate.toISOString().split('T')[0];
    }

    window.onload = () => {
        setTodayDate(); // Set tanggal hari ini secara lokal saat web dibuka
        if (!appPin) {
            document.getElementById('pinTitle').innerText = "Set PIN Baru";
            document.getElementById('pinMsg').innerText = "Buat 6 digit PIN keamanan anda";
        }
    };

    function verifyPin() {
        const input = document.getElementById('inputPin').value;
        if (!appPin) {
            if (input.length < 4) return alert("PIN minimal 4 angka!");
            localStorage.setItem('appPin', input);
            location.reload();
        } else {
            if (input === appPin) {
                document.getElementById('pinOverlay').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                updateCategoryOptions();
                render();
            } else {
                alert("PIN Salah!");
                document.getElementById('inputPin').value = "";
            }
        }
    }

    const categories = {
        income: ["Gaji", "Bonus", "Investasi", "Lainnya"],
        expense: ["Makan", "Transport", "Hiburan", "Bulanan", "Perawatan", "Kesehatan", "Kendaraan", "Lainnya"]
    };

    function formatCurrency(input, hiddenId) {
        let value = input.value.replace(/\D/g, "");
        document.getElementById(hiddenId).value = value;
        input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        if(hiddenId === 'realBaseLimit') render(); 
    }

    function updateCategoryOptions() {
        const type = document.getElementById('type').value;
        document.getElementById('category').innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function saveTransaction() {
        const amount = parseFloat(document.getElementById('realAmount').value);
        const date = document.getElementById('transDate').value;
        if (!amount || !date) return alert("Mohon isi nominal!");

        const data = { 
            id: Date.now(), 
            type: document.getElementById('type').value, 
            amount, 
            category: document.getElementById('category').value, 
            wallet: document.getElementById('wallet').value, 
            date, 
            note: document.getElementById('note').value || "-" 
        };

        const editIndex = document.getElementById('editIndex').value;
        if (editIndex === "") {
            transactions.push(data);
        } else {
            transactions[editIndex] = {...transactions[editIndex], ...data, id: transactions[editIndex].id};
            document.getElementById('editIndex').value = "";
            document.getElementById('saveBtn').innerText = "Simpan Transaksi";
        }

        localStorage.setItem('transactions', JSON.stringify(transactions));
        document.getElementById('displayAmount').value = '';
        document.getElementById('realAmount').value = '';
        document.getElementById('note').value = '';
        setTodayDate(); // Reset tanggal ke tanggal hari ini secara lokal setelah input data
        render();
    }

    function calculateRollingLimit() {
        const base = parseFloat(document.getElementById('realBaseLimit').value) || 0;
        if (base === 0 || transactions.length === 0) return base;
        const today = new Date(); today.setHours(0,0,0,0);
        let firstDate = new Date(Math.min(...transactions.map(t => new Date(t.date))));
        firstDate.setHours(0,0,0,0);
        let totalDays = Math.floor((today - firstDate) / (1000 * 60 * 60 * 24)) + 1;
        let totalJatah = totalDays * base;
        let totalPengeluaran = transactions.filter(t => t.type === 'expense' && new Date(t.date) <= today).reduce((s, t) => s + t.amount, 0);
        return totalJatah - totalPengeluaran;
    }

    function render() {
        const tbody = document.getElementById('tableBody');
        const search = document.getElementById('searchText').value.toLowerCase();
        tbody.innerHTML = '';
        let totalInc = 0, totalExp = 0, searchInc = 0, searchExp = 0;

        // PERBAIKAN LOGIKA URUTAN:
        // 1. Urutkan berdasarkan Tanggal (Besar ke Kecil)
        // 2. Jika tanggal sama, urutkan berdasarkan ID/Waktu Input (Besar ke Kecil)
        const sortedTransactions = [...transactions].sort((a, b) => {
            if (b.date !== a.date) {
                return new Date(b.date) - new Date(a.date);
            }
            return b.id - a.id;
        });

        sortedTransactions.forEach((t) => {
            if (t.type === 'income') totalInc += t.amount; else totalExp += t.amount;
            const matchSearch = t.date.includes(search) || t.category.toLowerCase().includes(search) || t.wallet.toLowerCase().includes(search) || t.note.toLowerCase().includes(search);

            if (matchSearch) {
                if (t.type === 'income') searchInc += t.amount; else searchExp += t.amount;
                const originalIndex = transactions.findIndex(item => item.id === t.id);
                tbody.innerHTML += `<tr>
                    <td><small>${t.date}</small></td>
                    <td><b>${t.category}</b> <small>(${t.wallet})</small><br><small>${t.note}</small></td>
                    <td style="color:${t.type==='income'?'green':'red'}">${t.type==='income'?'+':'-'} ${t.amount.toLocaleString('id-ID')}</td>
                    <td>
                        <button onclick="editRow(${originalIndex})" style="background:#3498db; color:white; border:none; border-radius:4px; padding:3px 5px;">✎</button>
                        <button onclick="deleteRow(${originalIndex})" style="background:#e74c3c; color:white; border:none; border-radius:4px; padding:3px 5px;">X</button>
                    </td>
                </tr>`;
            }
        });

        document.getElementById('sumIncome').innerText = "Rp " + searchInc.toLocaleString('id-ID');
        document.getElementById('sumExpense').innerText = "Rp " + searchExp.toLocaleString('id-ID');
        document.getElementById('rollingDisplay').innerText = "Rp " + calculateRollingLimit().toLocaleString('id-ID');
        document.getElementById('totalBalanceDisplay').innerText = 'Rp ' + (totalInc - totalExp).toLocaleString('id-ID');
        updateChart(totalInc, totalExp);
    }

    function updateChart(i, e) {
        const ctx = document.getElementById('financeChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Masuk', 'Keluar'], datasets: [{ data: [i, e], backgroundColor: ['#27ae60', '#e74c3c'], borderRadius: 5 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function deleteRow(i) { if(confirm("Hapus?")) { transactions.splice(i, 1); localStorage.setItem('transactions', JSON.stringify(transactions)); render(); } }
    
    function editRow(i) {
        const t = transactions[i];
        document.getElementById('type').value = t.type;
        updateCategoryOptions();
        document.getElementById('displayAmount').value = t.amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        document.getElementById('realAmount').value = t.amount;
        document.getElementById('category').value = t.category;
        document.getElementById('wallet').value = t.wallet;
        document.getElementById('transDate').value = t.date;
        document.getElementById('note').value = t.note;
        document.getElementById('editIndex').value = i;
        document.getElementById('saveBtn').innerText = "Update";
        window.scrollTo(0,0);
    }

    function exportToExcel() {
        const reportData = [...transactions].sort((a,b) => b.id - a.id).map(t => ({
            Tanggal: t.date, Tipe: t.type === 'income' ? 'Masuk' : 'Keluar', Kategori: t.category, Dompet: t.wallet, Nominal: t.amount, Catatan: t.note
        }));
        const totalInc = transactions.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
        const totalExp = transactions.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);
        reportData.push({}, { Tanggal: "TOTAL MASUK", Nominal: totalInc }, { Tanggal: "TOTAL KELUAR", Nominal: totalExp }, { Tanggal: "SALDO AKHIR", Nominal: totalInc - totalExp });
        const ws = XLSX.utils.json_to_sheet(reportData);
        ws['!autofilter'] = { ref: "A1:F1" };
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Laporan");
        XLSX.writeFile(wb, "PembukuanKantin_Secure.xlsx");
    }
</script>
</body>
</html>
